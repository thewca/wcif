name: Validate Specification
 
on:
  push:
    paths:
      - 'specification.md'
  pull_request:
    paths:
      - 'specification.md'
 
jobs:
  check:
    name: Run specification checks
    runs-on: ubuntu-latest
 
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
 
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
 
      - name: Run specification checker
        run: ruby scripts/check_spec.rb
